<!DOCTYPE html>
<html lang="en">

<head>
    <title>Automation Results</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
</head>

<body>
    <div class="container">
        <h2>Automation Report</h2>
        <table class="table table-bordered" border="1">
            <thead>
                <tr style="background-color:LightSkyBlue;">

                    <th>S.No</th>
                    <th>Test</th>
                    <th>Status</th>
                    <th>Error Message</th>
                    <th>Crashes</th>
                    <th>Attempts</th>

                </tr>
            </thead>
            <tbody>
                    QPOP_body
            </tbody>
        </table>
        <div class="row">
            <div class="col-sm-4">Passed: <b>QPOP_passed</b></div>
            <div class="col-sm-4">Failed: <b>QPOP_failed</b></div>
            <div class="col-sm-4">NA: <b>QPOP_na</b></div>
        </div>
        <div class="row">
            <div class="col-sm-4">Total: <b>QPOP_total</b></div>
        </div>
    </div>
</body>

</html>
